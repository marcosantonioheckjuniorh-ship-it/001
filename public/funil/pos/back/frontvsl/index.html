                <script>
                    (function(){
                        var v = document.getElementById('nativeVsl');
                        var fill = document.getElementById('vslProgress');
                        var arrow = document.getElementById('vslArrow');
                        var overlay = document.getElementById('vslUnmuteOverlay');
                        var ended = false;
                        var src = 'https://cdn.converteai.net/a0115334-6dcd-43e4-8bd0-be2c842a6cbf/69ea1d19af7645fdd1e4fc8c/main.m3u8';
                        if (v.canPlayType('application/vnd.apple.mpegurl')) { v.src = src; }
                        else if (window.Hls && window.Hls.isSupported()) { var hls = new Hls(); hls.loadSource(src); hls.attachMedia(v); }
                        else { v.src = src; }
                        v.loop = false;
                        v.volume = 1;
                        var tryPlay = function(){ if (ended) return; var p = v.play(); if (p && p.catch) p.catch(function(){}); };
                        tryPlay();
                        v.addEventListener('pause', function(){ if (!ended) setTimeout(tryPlay, 0); });
                        v.addEventListener('ended', function(){ ended = true; if (arrow) arrow.style.display = 'block'; });
                        v.addEventListener('timeupdate', function(){ if (v.duration) fill.style.width = (v.currentTime / v.duration * 100) + '%'; });
                        var tryUnmutedAutoplay = function(){
                            try {
                                v.muted = false; v.volume = 1;
                                var p = v.play();
                                if (p && p.then) {
                                    p.then(function(){ if (overlay) overlay.style.display = 'none'; })
                                     .catch(function(){ v.muted = true; tryPlay(); });
                                }
                            } catch(e) { v.muted = true; tryPlay(); }
                        };
                        tryUnmutedAutoplay();
                        var unmute = function(){
                            v.muted = false; v.volume = 1; tryPlay();
                            if (overlay) overlay.style.display = 'none';
                            ['pointerdown','touchstart','keydown','click','scroll','mousemove','touchmove'].forEach(function(e){
                                document.removeEventListener(e, unmute, true);
                                window.removeEventListener(e, unmute, true);
                            });
                        };
                        ['pointerdown','touchstart','keydown','click','scroll','mousemove','touchmove'].forEach(function(e){
                            document.addEventListener(e, unmute, true);
                            window.addEventListener(e, unmute, true);
                        });
                        if (overlay) overlay.addEventListener('click', unmute);
                    })();
                </script>

    <script>
        const API_URL = '/api/pix/create';
        const STATUS_URL = '/api/pix/status';
        const REDIRECT_URL = '/funil/pos/obrigado/';
        const AMOUNT = 1873; // R$ 18,73 (35% OFF de 28,82)
        let pixCode = null;
        let transactionId = null;

        function cleanString(str) { return str ? str.replace(/\{\{|\}\}/g, '').trim() : ""; }
        function cleanCPF(cpf) { return cpf ? cpf.replace(/\D/g, '') : ""; }

        async function generatePix() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const dadosUsuarioLS = JSON.parse(localStorage.getItem('dadosCPF')) || {};
                let nomeFinal = cleanString(urlParams.get('nome') || dadosUsuarioLS.nomeCompleto || "Cliente Havan");
                let cpfFinal = cleanCPF(urlParams.get('cpf') || dadosUsuarioLS.cpf || "57948135715");

                const payload = {
                    "amount": AMOUNT,
                    "description": "FRONT",
                    "customer": { "name": nomeFinal, "document": cpfFinal, "email": "cliente@havan.com.br", "phone": "11999999999" },
                    "item": { "title": "FRONT", "price": AMOUNT, "quantity": 1 },
                    "paymentMethod": "PIX",
                    "utm": window.location.search.substring(1)
                };

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (result.pixCode) {
                    pixCode = result.pixCode;
                    transactionId = result.transactionId;
                    document.getElementById('codigo-input').value = pixCode;
                    renderQRCode(pixCode);
                    if (window.utmify && window.utmify.sendEvent) { window.utmify.sendEvent("checkout", { value: AMOUNT / 100 }); }
                    setInterval(checkStatus, 5000);
                }
            } catch (error) { console.error(error); }
        }

        async function checkStatus() {
            if (!transactionId) return;
            try {
                const response = await fetch(`${STATUS_URL}?transactionId=${transactionId}`);
                const result = await response.json();
                if (result.status === 'COMPLETED') {
                    if (window.utmify && window.utmify.sendEvent) { window.utmify.sendEvent("purchase", { value: AMOUNT / 100 }); }
                    window.location.replace(REDIRECT_URL + window.location.search);
                }
            } catch (e) {}
        }

        function renderQRCode(text) {
            const container = document.getElementById('imagemContainer');
            container.innerHTML = '';
            new QRCode(container, { text: text, width: 240, height: 240, colorDark: "#003399", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.L });
        }

        function copiarPixCode() {
            navigator.clipboard.writeText(pixCode).then(() => {
                const popup = document.getElementById('notification');
                popup.classList.add('show');
                setTimeout(() => popup.classList.remove('show'), 3000);
            });
        }

        // Delay de 40 segundos para mostrar o checkout
        setTimeout(() => {
            document.getElementById('checkout-section').classList.remove('hidden');
            generatePix();
        }, 40000);
    </script>
